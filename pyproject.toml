[project]
name = "melten-runner-images"
version = "0.0.0"
description = "Actual-machine capability checks for GitHub Actions runner images"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.17.4", "pytest>=9.2.0", "pytest-cov>=7.1.0", "pyright>=1.1.414"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=runner_images --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.pyright]
include = ["runner_images"]
typeCheckingMode = "strict"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
