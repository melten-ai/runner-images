name: Build and publish cloud image
on:
  workflow_call:
    inputs:
      provider:
        type: string
        required: true
    secrets:
      RUNNER_IMAGES_WRITE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  image:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion == 'success'))
    concurrency:
      group: cloud-image-${{ inputs.provider }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PROVIDER: ${{ inputs.provider }}
      GH_TOKEN: ${{ github.token }}
      PACKER_GITHUB_API_TOKEN: ${{ github.token }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_MACHINE_TYPE: ${{ vars.GCP_MACHINE_TYPE }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_NETWORK: ${{ vars.GCP_NETWORK }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_BUILD_RESOURCE_GROUP: ${{ vars.AZURE_BUILD_RESOURCE_GROUP }}
      AZURE_VM_SIZE: ${{ vars.AZURE_VM_SIZE }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_GALLERY: ${{ vars.AZURE_GALLERY }}
      AZURE_IMAGE_DEFINITION: ${{ vars.AZURE_IMAGE_DEFINITION }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.2"
      - name: Install verified build-host tools
        run: |
          python3 cloud/linux/install-toolchains.py --host-tool oneup "$RUNNER_TEMP/runner-image-tools" "$RUNNER_TEMP/oneup.json"
          python3 cloud/linux/install-toolchains.py --host-tool grype "$RUNNER_TEMP/runner-image-tools" "$RUNNER_TEMP/grype.json"
          echo "$RUNNER_TEMP/runner-image-tools/bin" >> "$GITHUB_PATH"
      - uses: google-github-actions/auth@v3
        if: inputs.provider == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: inputs.provider == 'gcp'
      - uses: azure/login@v3
        if: inputs.provider == 'azure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve upstream base and skip unchanged inputs
        id: plan
        run: |
          git fetch origin main --tags
          git merge --ff-only origin/main
          python3 scripts/cloud-image.py plan "$PROVIDER"
      - name: Build cloud image and verify provisioning evidence
        id: build
        if: steps.plan.outputs.needed == 'true'
        run: python3 scripts/cloud-image.py build "$PROVIDER"
      - name: Scan native SBOM and block high or critical findings
        if: steps.plan.outputs.needed == 'true'
        run: grype "sbom:artifacts/cloud/$PROVIDER/sbom.syft.json" --config cloud/grype.json --fail-on high --output json --file "artifacts/cloud/$PROVIDER/vulnerabilities.json"
      - uses: actions/attest@v4
        if: steps.plan.outputs.needed == 'true'
        id: provenance
        with:
          subject-name: melten-ai/runner-images/cloud/${{ inputs.provider }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://melten.ai/runner-images/cloud-build/v1
          predicate-path: artifacts/cloud/${{ inputs.provider }}/image.json
      - uses: actions/attest-sbom@v4
        if: steps.plan.outputs.needed == 'true'
        id: sbom
        with:
          subject-name: melten-ai/runner-images/cloud/${{ inputs.provider }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: artifacts/cloud/${{ inputs.provider }}/sbom.spdx.json
      - name: Publish verified release
        if: steps.plan.outputs.needed == 'true'
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "artifacts/cloud/$PROVIDER/provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "artifacts/cloud/$PROVIDER/sbom.sigstore.json"
          python3 scripts/cloud-image.py publish "$PROVIDER"
      - name: Record released cloud image in Git
        if: steps.plan.outputs.record == 'true'
        env:
          GH_TOKEN: ${{ secrets.RUNNER_IMAGES_WRITE_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com
          bash scripts/commit-cloud.sh
      - name: Remove owned temporary resources and unpublished images
        if: always()
        run: python3 scripts/cloud-image.py cleanup "$PROVIDER"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloud-${{ inputs.provider }}-diagnostics
          path: |
            artifacts/cloud/${{ inputs.provider }}/image.json
            artifacts/cloud/${{ inputs.provider }}/inventory.json
            artifacts/cloud/${{ inputs.provider }}/toolchain-check.txt
            artifacts/cloud/${{ inputs.provider }}/sbom.spdx.json
            artifacts/cloud/${{ inputs.provider }}/sbom.syft.json
            artifacts/cloud/${{ inputs.provider }}/toolchains.json
            artifacts/cloud/${{ inputs.provider }}/comparison.json
            artifacts/cloud/${{ inputs.provider }}/packer-manifest.json
            artifacts/cloud/${{ inputs.provider }}/vulnerabilities.json
            artifacts/cloud/${{ inputs.provider }}/*.sigstore.json
            artifacts/cloud/${{ inputs.provider }}/cleanup.json
          if-no-files-found: ignore
          retention-days: 30
