name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify --ignore-local-actions
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install shell checks
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install shellcheck shfmt
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck shfmt
          fi
      - name: Install development tools
        run: uv sync --frozen
      - name: Check
        run: uv run python scripts/check.py
      - name: Test
        run: uv run python scripts/test.py
      - name: Verify root installation preserves runner cleanup permissions
        if: runner.os == 'Linux'
        run: sudo .venv/bin/python -m pytest tests/test_toolchains.py::test_npm_replacement_allows_runner_to_remove_its_old_tree --no-cov -q
  cloud-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.2"
      - uses: anchore/sbom-action/download-syft@v0
        id: syft
      - name: Check guest exclusions with the actual SBOM collector
        env:
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: python3 scripts/check-sbom.py "$SYFT_BIN"
      - name: Exercise verified build-host tools on Linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 cloud/linux/install-toolchains.py --host-tool oneup "$RUNNER_TEMP/runner-image-tools" "$RUNNER_TEMP/oneup.json"
          python3 cloud/linux/install-toolchains.py --host-tool grype "$RUNNER_TEMP/runner-image-tools" "$RUNNER_TEMP/grype.json"
          printf 'package image\nconst Version = "0.0.0"\n' > "$RUNNER_TEMP/version.go"
          "$RUNNER_TEMP/runner-image-tools/bin/oneup" version --source git --tag-prefix 'cloud-gcp@' --target "$RUNNER_TEMP/version.go"
          "$RUNNER_TEMP/runner-image-tools/bin/grype" version
      - name: Validate both cloud recipes without authentication or resources
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: python3 scripts/check-cloud.py
  cloud-toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install official checksum-verified toolchains in an isolated prefix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 cloud/linux/install-toolchains.py --resolve > "$RUNNER_TEMP/toolchains-plan.json"
          python3 cloud/linux/install-toolchains.py "$RUNNER_TEMP/toolchains" "$RUNNER_TEMP/toolchains.json" --specifications "$RUNNER_TEMP/toolchains-plan.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2]))' "$RUNNER_TEMP/toolchains-plan.json" "$RUNNER_TEMP/toolchains.json"
          export PATH="$RUNNER_TEMP/toolchains/bin:$RUNNER_TEMP/toolchains/go/bin:$PATH"
          node --version
          npm --version
          "$RUNNER_TEMP/toolchains/lib/docker/cli-plugins/docker-buildx" version
          git-lfs version
          go version
          rustc --version
          cargo --version
          work=$(mktemp -d)
          printf 'package main\nfunc main(){}\n' > "$work/main.go"
          go build -o "$work/go-smoke" "$work/main.go"
          "$work/go-smoke"
          printf 'fn main(){}\n' > "$work/main.rs"
          rustc "$work/main.rs" -o "$work/rust-smoke"
          "$work/rust-smoke"
          cargo new --quiet --bin --vcs none "$work/cargo-smoke"
          cargo build --quiet --offline --manifest-path "$work/cargo-smoke/Cargo.toml"
          "$work/cargo-smoke/target/debug/cargo-smoke"
