name: Release verified Tart image
run-name: Release Tart ${{ inputs.qualification }}
on:
  workflow_dispatch:
    inputs:
      qualification:
        description: Git-recorded qualification path submitted by the local build command
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: tart-image-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate source, comparison, SBOM and uploaded image
        id: evidence
        env:
          QUALIFICATION: ${{ inputs.qualification }}
          GH_TOKEN: ${{ github.token }}
          TART_REGISTRY_USERNAME: ${{ github.actor }}
        run: python3 scripts/release-tart.py prepare "$QUALIFICATION"
      - name: Install verified scanner and block high or critical findings
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 cloud/linux/install-toolchains.py --host-tool grype "$RUNNER_TEMP/runner-image-tools" "$RUNNER_TEMP/grype.json"
          "$RUNNER_TEMP/runner-image-tools/bin/grype" "sbom:$BUNDLE/sbom.syft.json" --fail-on high --output json --file artifacts/release/vulnerabilities.json
      - uses: actions/attest@v4
        id: provenance
        with:
          subject-name: ${{ steps.evidence.outputs.subject }}
          subject-digest: ${{ steps.evidence.outputs.digest }}
          predicate-type: https://melten.ai/runner-images/local-build/v1
          predicate-path: artifacts/release/provenance.json
      - uses: actions/attest-sbom@v4
        id: sbom
        with:
          subject-name: ${{ steps.evidence.outputs.subject }}
          subject-digest: ${{ steps.evidence.outputs.digest }}
          sbom-path: ${{ steps.evidence.outputs.bundle }}/sbom.spdx.json
      - name: Publish release and record completion
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" artifacts/release/provenance.sigstore.json
          cp "$SBOM_BUNDLE" artifacts/release/sbom.sigstore.json
          python3 scripts/release-tart.py publish
      - name: Record completion on protected main
        env:
          GH_TOKEN: ${{ secrets.RUNNER_IMAGES_WRITE_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com
          bash scripts/commit-release.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-diagnostics
          path: artifacts/release/
          retention-days: 30
  reconcile:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: image-rebuild-issues
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reconcile-rebuilds.py
