name: Release cloud runner images
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Hosted reference inventories]
    types: [completed]
permissions:
  contents: read
jobs:
  image:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion == 'success'))
    strategy:
      fail-fast: false
      matrix:
        provider: [gcp, azure]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/cloud-image.yml
    with:
      provider: ${{ matrix.provider }}
